# Builds and checks the site on every pull request, and deploys main to the
# andrewedmond Cloudflare Worker. The "build" job is the required check on main.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # MFL Marketing publishes through note/* and copy/* branches. Those may
      # only touch content; layout, CSS and the build stay with the build.
      - name: Content branches touch only content paths
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'note/') || startsWith(github.head_ref, 'copy/'))
        env:
          BASE: ${{ github.base_ref }}
        run: |
          outside=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^(notes/_posts/|notes/assets/|content/pages/)' || true)
          if [ -n "$outside" ]; then
            echo "This content branch changes files outside notes/_posts/, notes/assets/ and content/pages/:"
            echo "$outside"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and check
        run: node build.mjs

      - name: Check the Worker parses
        run: node --check worker/index.js && node --check worker/subscribe.js && node --check worker/send.js && node --check worker/email.js && node --check worker/oidc.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9172138826e5dfcc3cd6bf986bab5324
      WRANGLER: npx --yes wrangler@4.160.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: node build.mjs

      - name: Apply database migrations
        run: $WRANGLER d1 migrations apply andrewedmond --remote

      - name: Deploy the Worker
        run: $WRANGLER deploy

      # Runtime secrets live in GitHub (vendor registry rule) and are copied to the Worker on every deploy.
      - name: Copy secrets to the Worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          umask 077
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify({RESEND_API_KEY: process.env.RESEND_API_KEY, TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY}))'
          $WRANGLER secret bulk "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://www.andrewedmond.com/) && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "Home page answered $code"; exit 1
